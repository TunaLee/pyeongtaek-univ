<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --pass:#2BA84A; --fail:#E8344E; --ink:#17181A; --muted:#6B7075; --line:#E4E6E8; --soft:#F5F6F7; --off:#D5D8DB; --band:#FDE6E9; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink);
         font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  .app { width: 1280px; height: 720px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  header { display: flex; align-items: center; gap: 14px; height: 36px; }
  h1 { font-size: 20px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  .tools { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; }
  button, .filebtn { font: inherit; font-size: 13px; border: 1px solid var(--line); background: #fff; color: var(--ink);
                     border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover, .filebtn:hover { border-color: var(--ink); }
/*s8*/
  .filebtn input { display: none; }
  .goal input { width: 54px; font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; text-align: right; }
  .msg { color: var(--fail); font-size: 12px; }
/*/s8*/
  .cols { flex: 1; display: grid; grid-template-columns: 372px 1fr; gap: 12px; min-height: 0; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fff; min-height: 0; }
  .card h2 { font-size: 14px; margin: 0 0 6px; }
  .right { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .kpi .lb { font-size: 12px; color: var(--muted); }
  .kpi .v { font-size: 26px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .kpi .v small { font-size: 13px; font-weight: 500; margin-left: 2px; color: var(--muted); }
  .kpi .d { font-size: 12px; color: var(--muted); height: 16px; }
  .kpi.main { border-color: var(--ink); }
  .up { color: var(--pass); } .dn { color: var(--fail); }
  .viz { flex: 1; display: grid; grid-template-columns: 1fr 340px; gap: 10px; min-height: 0; }
  .charts { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .charts .card { flex: 1; }
  #map { width: 100%; height: calc(100% - 46px); display: block; }
  .legend { display: flex; gap: 16px; font-size: 13px; margin-top: 4px; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  svg.chart { width: 100%; height: calc(100% - 24px); display: block; }
  /* 조절 바 */
  .ctl-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .ctl { padding: 5px 0 6px; border-top: 1px solid var(--line); }
  .ctl .top { display: flex; align-items: baseline; gap: 6px; font-size: 13px; }
  .ctl .top b { font-weight: 600; }
  .ctl .top .val { font-variant-numeric: tabular-nums; }
  .ctl .top .hit { margin-left: auto; font-size: 12px; color: var(--muted); }
  .ctl .top .hit.on { color: var(--fail); }
  .hist { display: block; width: calc(100% - 14px); height: 22px; margin: 3px 7px 0; }
  .track { position: relative; height: 16px; }
  .track input { position: absolute; left: 0; top: 0; width: 100%; margin: 0; height: 16px; background: none;
                 pointer-events: none; -webkit-appearance: none; appearance: none; }
  .track input::-webkit-slider-runnable-track { height: 3px; background: var(--line); border-radius: 2px; }
  .track input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 14px; height: 14px; margin-top: -5.5px;
                                       border-radius: 50%; background: #fff; border: 2px solid var(--ink); cursor: pointer; }
  .track input + input::-webkit-slider-runnable-track { background: none; }
  .ctl label { font-size: 13px; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  #tip { position: fixed; pointer-events: none; background: var(--ink); color: #fff; font-size: 11px; line-height: 1.45;
         padding: 7px 9px; border-radius: 6px; display: none; z-index: 10; font-variant-numeric: tabular-nums; }
  #tip td { padding: 0 6px 0 0; } #tip td:first-child { color: #B8BDC2; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title"></h1>
    <span class="meta" id="meta"></span>
    <div class="tools">
<!--s8-->
      <span class="msg" id="msg"></span>
      <label class="filebtn">파일 불러오기<input type="file" id="file" accept=".xlsx,.csv"></label>
      <label class="goal">목표 <input type="number" id="goal" min="0" max="100" step="0.5"> %</label>
      <button type="button" id="down">CSV 내려받기</button>
<!--/s8-->
    </div>
  </header>
  <div class="cols">
    <div class="card" id="ctlCard">
      <div class="ctl-head"><h2 style="margin:0">합격 기준</h2><button type="button" id="reset">처음 값</button></div>
      <div id="ctls"></div>
    </div>
    <div class="right">
      <div class="kpis">
        <div class="kpi"><div class="lb" id="lTotal"></div><div class="v"><span id="kTotal"></span><small class="cu"></small></div><div class="d" id="kEx"></div></div>
        <div class="kpi"><div class="lb" id="lPass"></div><div class="v up"><span id="kPass"></span><small class="cu"></small></div><div class="d"></div></div>
        <div class="kpi"><div class="lb" id="lFail"></div><div class="v dn"><span id="kFail"></span><small class="cu"></small></div><div class="d"></div></div>
        <div class="kpi main"><div class="lb" id="lRate"></div><div class="v"><span id="kRate"></span><small>%</small></div><div class="d" id="kGoal"></div></div>
        <div class="kpi"><div class="lb" id="lOrig"></div><div class="v"><span id="kOrig"></span><small>%</small></div><div class="d" id="kDelta"></div></div>
      </div>
      <div class="viz">
        <div class="card">
          <h2 id="mapTitle"></h2>
          <svg id="map" role="img"></svg>
          <div class="legend" id="legend"></div>
        </div>
        <div class="charts">
          <div class="card"><h2 id="reasonTitle"></h2><svg class="chart" id="reasons" viewBox="0 0 316 200" preserveAspectRatio="xMinYMin meet"></svg></div>
          <div class="card"><h2 id="zoneTitle"></h2><svg class="chart" id="zones" viewBox="0 0 316 130" preserveAspectRatio="xMinYMin meet"></svg></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="tip"></div>

<script>
// ① 데이터: 엑셀을 CSV 글자로 저장해 그대로 붙여 넣었다 (한 줄 = 하나)
const CSV_TEXT = `__CSV__`;

// ② 설정: 열 이름 · 화면 이름 · 합격 기준표
const CFG = /*__CFG__*/{};

const $ = id => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';
const COLOR = { pass: '#2BA84A', fail: '#E8344E', off: '#D5D8DB', bar: '#9AA1A8', band: '#FDE6E9', ink: '#17181A', muted: '#6B7075' };
const reasonName = Object.fromEntries(CFG.reasons);
const NUM_COLS = [...CFG.rules.map(r => r.col), ...CFG.scopes.map(s => s.col), CFG.x, CFG.y];
const LIMITS = [...CFG.rules.filter(r => r.kind !== 'flag'), ...CFG.scopes];

let rows = [], header = [], dataName = CFG.dataName;
let spec = {}, range = {};
let cells = [];          // 지도 네모 (행 순서와 같다)

function el(tag, attrs = {}, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
const decOf = step => Math.max(0, -Math.floor(Math.log10(step) + 1e-9));
const snap = (v, step) => Number((Math.round(v / step) * step).toFixed(decOf(step)));
const fmt = (v, step) => Number(v).toFixed(decOf(step));

function parseCSV(text) {
  const lines = text.replace(/^﻿/, '').trim().split(/\r?\n/);
  const head = lines[0].split(',').map(s => s.trim());
  const out = lines.slice(1).filter(l => l.trim()).map(l => {
    const c = l.split(','), o = {};
    head.forEach((h, i) => o[h] = (c[i] ?? '').trim());
    return o;
  });
  return { head, out };
}

// ③ 데이터를 받아 화면 전체를 그 데이터에 맞춘다 (조절 바 범위도 데이터 최솟값 · 최댓값으로)
function setData(head, data, name) {
  const need = [...NUM_COLS, CFG.zoneCol];
  const miss = need.filter(c => !head.includes(c));
  if (miss.length) throw new Error('없는 열: ' + miss.join(', '));
  if (!data.length) throw new Error('데이터 줄이 없습니다');
  data.forEach(r => { r._raw = head.map(h => r[h]); NUM_COLS.forEach(c => r[c] = Number(r[c])); });
  const bad = NUM_COLS.find(c => data.some(r => !Number.isFinite(r[c])));
  if (bad) throw new Error('숫자가 아닌 값이 있는 열: ' + bad);
  rows = data; header = head; dataName = name;
  range = {};
  for (const c of LIMITS) {
    const v = rows.map(r => r[c.col]);
    let a = Math.min(...v), b = Math.max(...v);
    if (c.lo != null) a = Math.min(a, c.lo);
    if (c.hi != null) b = Math.max(b, c.hi);
    const pad = c.step < 1 ? (b - a) * 0.05 : 0;
    range[c.col] = { min: snap(Math.floor((a - pad) / c.step) * c.step, c.step),
                     max: snap(Math.ceil((b + pad) / c.step - 1e-9) * c.step, c.step) };
  }
  for (const s of CFG.scopes) {           // 집계 범위는 데이터 최댓값이 처음 값
    const mx = Math.max(...rows.map(r => r[s.col]));
    s.hi = snap(Math.ceil(mx / s.step - 1e-9) * s.step, s.step);
    range[s.col] = { min: snap(Math.floor(Math.min(...rows.map(r => r[s.col])) / s.step) * s.step, s.step), max: s.hi };
  }
  buildMap();
  resetSpec();
}

function resetSpec() {
  spec = {};
  for (const r of CFG.rules) spec[r.col] = r.kind === 'flag' ? { on: true } : { lo: r.lo, hi: r.hi };
  for (const s of CFG.scopes) spec[s.col] = { hi: s.hi };
  buildControls();
  update();
}

// 주소 끝 #ioff_na_hi=20&crack_on=0 처럼 처음 기준을 바꿔 열 수 있다
function applyHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return;
  for (const part of h.split('&')) {
    const [k, v] = part.split('=');
    const m = k.match(/^(.+)_(lo|hi|on)$/);
    if (m && spec[m[1]]) spec[m[1]][m[2]] = m[2] === 'on' ? v !== '0' : Number(v);
/*s8*/
    if (k === 'target') $('goal').value = v;
/*/s8*/
  }
  buildControls();
  update();
}

// ④ 판정: 기준표를 위에서부터 확인하고 처음 걸린 사유 하나를 돌려준다
function judge(r) {
  for (const rule of CFG.rules) {
    const s = spec[rule.col], v = r[rule.col];
    if (rule.kind === 'flag') { if (s.on && v > 0) return rule.reason; continue; }
    if ((s.lo != null && v < s.lo) || (s.hi != null && v > s.hi)) return rule.reason;
  }
  return 'none';
}
const inScope = r => CFG.scopes.every(s => r[s.col] <= spec[s.col].hi);
const failsRule = (r, rule) => rule.kind === 'flag' ? spec[rule.col].on && r[rule.col] > 0
  : (spec[rule.col].lo != null && r[rule.col] < spec[rule.col].lo) || (spec[rule.col].hi != null && r[rule.col] > spec[rule.col].hi);

// ⑤ 조절 바: 기준표 한 줄 = 조절 바 하나 (분포 막대 위에 합격선)
function buildControls() {
  const box = $('ctls');
  box.innerHTML = '';
  const items = [...CFG.rules, ...CFG.scopes.map(s => ({ ...s, scope: true }))];
  for (const c of items) {
    const d = document.createElement('div');
    d.className = 'ctl';
    if (c.kind === 'flag') {
      d.innerHTML = `<div class="top"><b>${c.name}</b><span class="hit" id="hit_${c.col}"></span></div>
        <label><input type="checkbox" id="in_${c.col}_on" ${spec[c.col].on ? 'checked' : ''}> ${c.flagText}</label>`;
      box.appendChild(d);
      d.querySelector('input').addEventListener('input', e => { spec[c.col].on = e.target.checked; update(); });
      continue;
    }
    const g = range[c.col], sides = c.scope ? ['hi'] : ['lo', 'hi'].filter(k => spec[c.col][k] != null);
    d.innerHTML = `<div class="top"><b>${c.name}</b><span class="val" id="val_${c.col}"></span>
        <span class="hit" id="hit_${c.col}"></span></div>
      <svg class="hist" id="h_${c.col}" viewBox="0 0 340 22" preserveAspectRatio="none"></svg>
      <div class="track">${sides.map(k => `<input type="range" id="in_${c.col}_${k}" min="${g.min}" max="${g.max}" step="${c.step}" value="${spec[c.col][k]}">`).join('')}</div>`;
    box.appendChild(d);
    for (const k of sides) {
      $(`in_${c.col}_${k}`).addEventListener('input', e => {
        let v = Number(e.target.value);
        const s = spec[c.col];
        if (k === 'lo' && s.hi != null && v > s.hi) v = s.hi;
        if (k === 'hi' && s.lo != null && v < s.lo) v = s.lo;
        s[k] = v; e.target.value = v;
        update();
      });
    }
  }
}

function drawHist(c) {
  const svg = $('h_' + c.col), g = range[c.col], s = spec[c.col], N = 48, W = 340, H = 22;
  const bins = new Array(N).fill(0);
  rows.forEach(r => { bins[Math.min(N - 1, Math.max(0, Math.floor((r[c.col] - g.min) / (g.max - g.min) * N)))]++; });
  const top = Math.sqrt(Math.max(...bins)), X = v => (v - g.min) / (g.max - g.min) * W;
  svg.innerHTML = '';
  if (s.lo != null) svg.appendChild(el('rect', { x: 0, y: 0, width: Math.max(0, X(s.lo)), height: H, fill: COLOR.band }));
  if (s.hi != null) svg.appendChild(el('rect', { x: X(s.hi), y: 0, width: Math.max(0, W - X(s.hi)), height: H, fill: COLOR.band }));
  bins.forEach((n, i) => {
    if (!n) return;
    const h = Math.max(1.5, Math.sqrt(n) / top * (H - 2));
    svg.appendChild(el('rect', { x: i * W / N + 0.6, y: H - h, width: W / N - 1.2, height: h, fill: COLOR.bar }));
  });
  for (const v of [s.lo, s.hi]) if (v != null) svg.appendChild(el('line', { x1: X(v), x2: X(v), y1: 0, y2: H, stroke: COLOR.fail, 'stroke-width': 2 }));
}

// ⑥ 지도: (x, y) 칸 하나에 한 줄. 한 칸에 여러 줄이면 칸을 작게 나눠 나란히 놓는다
function buildMap() {
  const svg = $('map');
  svg.innerHTML = '';
  const xs = rows.map(r => r[CFG.x]), ys = rows.map(r => r[CFG.y]);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (CFG.outline) { x0 = Math.min(x0, -CFG.outline); x1 = Math.max(x1, CFG.outline - 1); y0 = Math.min(y0, -CFG.outline); y1 = Math.max(y1, CFG.outline - 1); }
  const nx = x1 - x0 + 1, ny = y1 - y0 + 1, S = 100 / Math.max(nx, ny);
  const slot = {}, count = {};
  rows.forEach(r => { const k = r[CFG.x] + ',' + r[CFG.y]; count[k] = (count[k] || 0) + 1; });
  const sub = Math.ceil(Math.sqrt(Math.max(...Object.values(count))));
  svg.setAttribute('viewBox', `-1 -1 ${nx * S + 2} ${ny * S + 2}`);
  if (CFG.outline) {
    svg.appendChild(el('circle', { cx: (0 - x0) * S, cy: (y1 + 1) * S, r: CFG.outline * S, fill: 'none', stroke: '#C4C9CE', 'stroke-width': 0.35 }));
  } else {
    for (const k in count) {
      const [x, y] = k.split(',').map(Number);
      svg.appendChild(el('rect', { x: (x - x0) * S + 0.15, y: (y1 - y) * S + 0.15, width: S - 0.3, height: S - 0.3, fill: '#F1F2F4' }));
    }
  }
  const pad = sub > 1 ? 0.06 : 0.04;
  cells = rows.map((r, i) => {
    const k = r[CFG.x] + ',' + r[CFG.y], n = slot[k] = (slot[k] || 0) + 1, j = n - 1;
    const w = S / sub;
    const rect = el('rect', { x: (r[CFG.x] - x0) * S + (j % sub) * w + w * pad, y: (y1 - r[CFG.y]) * S + Math.floor(j / sub) * w + w * pad,
                              width: w * (1 - 2 * pad), height: w * (1 - 2 * pad), rx: w * 0.08 });
    rect.addEventListener('mousemove', e => showTip(e, i));
    rect.addEventListener('mouseleave', () => $('tip').style.display = 'none');
    svg.appendChild(rect);
    return rect;
  });
}

function showTip(e, i) {
  const r = rows[i], k = judge(r), tip = $('tip');
  const res = !inScope(r) ? '집계 제외' : k === 'none' ? CFG.labels.pass : reasonName[k];
  tip.innerHTML = '<table>' + header.map((h, j) => `<tr><td>${h}</td><td>${r._raw[j]}</td></tr>`).join('') +
    `<tr><td>화면 판정</td><td><b>${res}</b></td></tr></table>`;
  tip.style.display = 'block';
  const x = e.clientX + 14, y = Math.min(e.clientY + 10, innerHeight - tip.offsetHeight - 6);
  tip.style.left = (x + tip.offsetWidth > innerWidth ? e.clientX - tip.offsetWidth - 14 : x) + 'px';
  tip.style.top = Math.max(6, y) + 'px';
}

// 가로 막대: 이름 · 막대 · 숫자
function hbars(svg, items, max, color, W, rowH) {
  svg.innerHTML = '';
  const L = 96, R = 56, bw = W - L - R;
  items.forEach((it, i) => {
    const y = i * rowH + 4, h = rowH - 10;
    svg.appendChild(el('text', { x: L - 8, y: y + h / 2 + 4, 'text-anchor': 'end', 'font-size': 12, fill: COLOR.ink }, it.label));
    svg.appendChild(el('rect', { x: L, y, width: Math.max(0, it.value / (max || 1) * bw), height: h, rx: 2, fill: color }));
    svg.appendChild(el('text', { x: L + Math.max(0, it.value / (max || 1) * bw) + 6, y: y + h / 2 + 4, 'font-size': 12, 'font-weight': 600, fill: COLOR.ink }, it.text));
  });
}

// ⑦ 다시 그리기: 기준이 바뀔 때마다 카드 · 지도 · 차트 · 분포가 함께 바뀐다
function update() {
  const L = CFG.labels;
  const res = rows.map(r => ({ r, ins: inScope(r), k: judge(r) }));
  const sc = res.filter(x => x.ins);
  const total = sc.length, pass = sc.filter(x => x.k === 'none').length, fail = total - pass;
  const rate = total ? pass / total * 100 : 0;
  const origPass = rows.filter(r => r[CFG.judgeCol] === CFG.passValue).length;
  const hasOrig = header.includes(CFG.judgeCol);
  const orig = origPass / rows.length * 100;

  $('meta').textContent = `${dataName} · ${rows.length}줄`;
  $('kTotal').textContent = total;
  $('kEx').textContent = total < rows.length ? `${rows.length - total}${CFG.count} 집계 제외` : '전체 줄';
  $('kPass').textContent = pass;
  $('kFail').textContent = fail;
  $('kRate').textContent = rate.toFixed(2);
  $('kOrig').textContent = hasOrig ? orig.toFixed(2) : '-';
  const dp = rate.toFixed(2) - orig.toFixed(2);
  $('kDelta').innerHTML = hasOrig ? `차이 <b class="${dp > 0 ? 'up' : dp < 0 ? 'dn' : ''}">${dp > 0 ? '+' : ''}${dp.toFixed(2)}%p</b>` : '';
/*s8*/
  const goal = Number($('goal').value);
  $('kGoal').innerHTML = rate.toFixed(2) >= goal ? `<b class="up">목표 ${goal}% 달성</b>`
    : `<b class="dn">목표 ${goal}%까지 ${(goal - rate.toFixed(2)).toFixed(2)}%p</b>`;
/*/s8*/

  // 지도 색
  res.forEach((x, i) => cells[i].setAttribute('fill', !x.ins ? COLOR.off : x.k === 'none' ? COLOR.pass : COLOR.fail));
  const ex = rows.length - total;
  $('legend').innerHTML = `<span><i style="background:${COLOR.pass}"></i>${L.pass} ${pass}</span>` +
    `<span><i style="background:${COLOR.fail}"></i>${L.fail} ${fail}</span>` +
    (ex ? `<span><i style="background:${COLOR.off}"></i>집계 제외 ${ex}</span>` : '');

  // 사유별 (많은 순)
  const byReason = CFG.reasons.map(([key, name]) => ({ label: name, value: sc.filter(x => x.k === key).length }))
    .sort((a, b) => b.value - a.value).map(it => ({ ...it, text: String(it.value) }));
  hbars($('reasons'), byReason, Math.max(1, ...byReason.map(b => b.value)), COLOR.fail, 316, 200 / CFG.reasons.length);
  // 위치별
  const byZone = CFG.zones.map(([key, name]) => {
    const z = sc.filter(x => x.r[CFG.zoneCol] === key), p = z.filter(x => x.k === 'none').length;
    const v = z.length ? p / z.length * 100 : 0;
    return { label: name, value: v, text: z.length ? v.toFixed(1) + '%' : '-' };
  });
  hbars($('zones'), byZone, 100, COLOR.pass, 316, 130 / CFG.zones.length);

  // 조절 바 옆 숫자 · 분포
  for (const c of [...CFG.rules, ...CFG.scopes]) {
    const s = spec[c.col], v = $('val_' + c.col), hit = $('hit_' + c.col);
    if (CFG.scopes.includes(c)) {
      v.textContent = `≤ ${fmt(s.hi, c.step)} ${c.unit}`;
      const out = rows.filter(r => r[c.col] > s.hi).length;
      hit.textContent = `제외 ${out}`; hit.className = 'hit' + (out ? ' on' : '');
    } else {
      const n = sc.filter(x => failsRule(x.r, c)).length;
      hit.textContent = `걸림 ${n}`; hit.className = 'hit' + (n ? ' on' : '');
      if (c.kind === 'flag') continue;
      v.textContent = (s.lo != null && s.hi != null) ? `${fmt(s.lo, c.step)} ~ ${fmt(s.hi, c.step)} ${c.unit}`
        : s.lo != null ? `≥ ${fmt(s.lo, c.step)} ${c.unit}` : `≤ ${fmt(s.hi, c.step)} ${c.unit}`;
    }
    if (c.kind !== 'flag') {
      drawHist(c);
      for (const k of ['lo', 'hi']) { const inp = $(`in_${c.col}_${k}`); if (inp) inp.value = s[k]; }
    }
  }
}

// ⑧ 다른 엑셀 · CSV 불러오기 (엑셀 .xlsx 는 압축 파일이라 직접 풀어 읽는다)
async function readXlsx(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let e = u8.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('엑셀 파일을 읽을 수 없습니다');
  const files = {};
  let p = dv.getUint32(e + 16, true);
  for (let i = 0, n = dv.getUint16(e + 10, true); i < n; i++) {
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nl));
    files[name] = { method: dv.getUint16(p + 10, true), size: dv.getUint32(p + 20, true), off: dv.getUint32(p + 42, true) };
    p += 46 + nl + xl + cl;
  }
  const read = async name => {
    const f = files[name];
    if (!f) return null;
    const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
    const raw = u8.subarray(start, start + f.size);
    if (f.method === 0) return new TextDecoder().decode(raw);
    const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(stream).text();
  };
  const xml = s => new DOMParser().parseFromString(s, 'application/xml');
  const ssText = await read('xl/sharedStrings.xml');
  const shared = ssText ? [...xml(ssText).getElementsByTagName('si')].map(si => si.textContent) : [];
  const sheetName = Object.keys(files).filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
  const sheet = xml(await read(sheetName));
  const colIdx = ref => [...ref.replace(/\d+/g, '')].reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1;
  const table = [...sheet.getElementsByTagName('row')].map(row => {
    const out = [];
    for (const c of row.getElementsByTagName('c')) {
      const t = c.getAttribute('t'), v = c.getElementsByTagName('v')[0];
      out[colIdx(c.getAttribute('r'))] = t === 's' ? shared[Number(v.textContent)]
        : t === 'inlineStr' ? c.textContent : !v ? '' : (!t || t === 'n') ? String(Number(v.textContent)) : v.textContent;
    }
    return out;
  }).filter(r => r.length);
  const head = table[0].map(h => String(h ?? '').trim());
  const out = table.slice(1).map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ''])));
  return { head, out };
}

$('file').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const t = /\.xlsx$/i.test(f.name) ? await readXlsx(await f.arrayBuffer()) : parseCSV(await f.text());
    setData(t.head, t.out, f.name);
    $('msg').textContent = '';
  } catch (err) {
    $('msg').textContent = err.message;
  }
  e.target.value = '';
});

// ⑨ 판정 결과 CSV 내려받기: 기준값 줄 → 빈 줄 → 줄마다 판정
function downloadCSV() {
  const q = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v;
  const lines = [['기준', '값'], ['데이터', dataName]];
  for (const r of CFG.rules) {
    const s = spec[r.col];
    if (r.kind === 'flag') { lines.push([r.name, s.on ? '판정함' : '판정 안 함']); continue; }
    if (s.lo != null) lines.push([`${r.name} 하한(${r.unit})`, s.lo]);
    if (s.hi != null) lines.push([`${r.name} 상한(${r.unit})`, s.hi]);
  }
  for (const s of CFG.scopes) lines.push([`${s.name} 상한(${s.unit})`, spec[s.col].hi]);
  lines.push([`${CFG.labels.rate}(%)`, $('kRate').textContent], []);
  lines.push([...header, 'sim_scope', 'sim_reason', 'sim_result']);
  for (const r of rows) {
    const ins = inScope(r), k = judge(r);
    lines.push([...r._raw, ins ? 'IN' : 'OUT', k, ins ? (k === 'none' ? CFG.passValue : (CFG.failValue || 'FAIL')) : '']);
  }
  const blob = new Blob(['﻿' + lines.map(l => l.map(q).join(',')).join('\n') + '\n'], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '판정결과_' + dataName.replace(/\.(xlsx|csv)$/i, '') + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}
$('down').addEventListener('click', downloadCSV);
$('goal').value = CFG.target;
$('goal').addEventListener('input', update);
