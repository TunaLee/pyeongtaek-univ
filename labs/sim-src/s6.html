<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --pass:#2BA84A; --fail:#E8344E; --ink:#17181A; --muted:#6B7075; --line:#E4E6E8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink);
         font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  .app { width: 1280px; height: 720px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  header { display: flex; align-items: baseline; gap: 14px; height: 30px; }
  h1 { font-size: 20px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fff; min-height: 0; }
  .card h2 { font-size: 14px; margin: 0 0 6px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
  .kpi .lb { font-size: 12px; color: var(--muted); }
  .kpi .v { font-size: 28px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .kpi .v small { font-size: 13px; font-weight: 500; margin-left: 2px; color: var(--muted); }
  .kpi.main { border-color: var(--ink); }
  .up { color: var(--pass); } .dn { color: var(--fail); }
  .viz { flex: 1; display: grid; grid-template-columns: 500px 1fr; gap: 10px; min-height: 0; }
  .right { display: grid; grid-template-rows: 1fr 1fr; gap: 10px; min-height: 0; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-height: 0; }
  #map { width: 100%; height: calc(100% - 46px); display: block; }
  .legend { display: flex; gap: 16px; font-size: 13px; margin-top: 4px; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  svg.chart { width: 100%; height: calc(100% - 24px); display: block; }
  .dist-head { display: flex; align-items: baseline; gap: 10px; }
  .dist-head .val { font-size: 14px; font-weight: 700; color: var(--fail); font-variant-numeric: tabular-nums; }
  .dist-head .hit { margin-left: auto; font-size: 13px; color: var(--muted); }
  #dist { width: 100%; height: 150px; display: block; }
  #slider { width: calc(100% - 2 * (4.41% - 8px)); margin: 4px calc(4.41% - 8px) 0; display: block; accent-color: var(--ink); }
  #tip { position: fixed; pointer-events: none; background: var(--ink); color: #fff; font-size: 11px; line-height: 1.45;
         padding: 7px 9px; border-radius: 6px; display: none; z-index: 10; font-variant-numeric: tabular-nums; }
  #tip td { padding: 0 6px 0 0; } #tip td:first-child { color: #B8BDC2; }
</style>
</head>
<body>
<div class="app">
  <header><h1 id="title"></h1><span class="meta" id="meta"></span></header>
  <div class="kpis">
    <div class="kpi"><div class="lb" id="lTotal"></div><div class="v"><span id="kTotal"></span><small class="cu"></small></div></div>
    <div class="kpi"><div class="lb" id="lPass"></div><div class="v up"><span id="kPass"></span><small class="cu"></small></div></div>
    <div class="kpi"><div class="lb" id="lFail"></div><div class="v dn"><span id="kFail"></span><small class="cu"></small></div></div>
    <div class="kpi main"><div class="lb" id="lRate"></div><div class="v"><span id="kRate"></span><small>%</small></div></div>
  </div>
  <div class="viz">
    <div class="card">
      <h2 id="mapTitle"></h2>
      <svg id="map" role="img"></svg>
      <div class="legend" id="legend"></div>
    </div>
    <div class="right">
      <div class="row2">
        <div class="card"><h2 id="reasonTitle"></h2><svg class="chart" id="reasons" viewBox="0 0 330 170" preserveAspectRatio="xMinYMin meet"></svg></div>
        <div class="card"><h2 id="zoneTitle"></h2><svg class="chart" id="zones" viewBox="0 0 330 120" preserveAspectRatio="xMinYMin meet"></svg></div>
      </div>
      <div class="card">
        <div class="dist-head"><h2 id="distTitle"></h2><span class="val" id="val"></span><span class="hit" id="hit"></span></div>
        <svg id="dist" viewBox="0 0 680 150" preserveAspectRatio="none"></svg>
        <input type="range" id="slider">
      </div>
    </div>
  </div>
</div>
<div id="tip"></div>

<script>
// ① 데이터: 엑셀을 CSV 글자로 저장해 그대로 붙여 넣었다 (한 줄 = 하나)
const CSV_TEXT = `__CSV__`;

// ② 설정: 열 이름 · 화면 이름 · 합격 기준표
const CFG = /*__CFG__*/{};

const $ = id => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';
const COLOR = { pass: '#2BA84A', fail: '#E8344E', bar: '#9AA1A8', band: '#FDE6E9', ink: '#17181A', muted: '#6B7075' };
const reasonName = Object.fromEntries(CFG.reasons);
const NUM_COLS = [...CFG.rules.map(r => r.col), CFG.x, CFG.y];
const RULE = CFG.rules.find(r => r.col === CFG.slider);     // 조절 바로 바꾸는 기준 하나
const SIDE = RULE.hi != null ? 'hi' : 'lo';                  // 상한(이하 합격) 또는 하한(이상 합격)
const over = v => SIDE === 'hi' ? v > spec[RULE.col].hi : v < spec[RULE.col].lo;

function el(tag, attrs = {}, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
const decOf = step => Math.max(0, -Math.floor(Math.log10(step) + 1e-9));

function parseCSV(text) {
  const lines = text.replace(/^﻿/, '').trim().split(/\r?\n/);
  const head = lines[0].split(',').map(s => s.trim());
  const out = lines.slice(1).filter(l => l.trim()).map(l => {
    const c = l.split(','), o = {};
    head.forEach((h, i) => o[h] = (c[i] ?? '').trim());
    return o;
  });
  return { head, out };
}
const { head: header, out: rows } = parseCSV(CSV_TEXT);
rows.forEach(r => { r._raw = header.map(h => r[h]); NUM_COLS.forEach(c => r[c] = Number(r[c])); });

// ③ 기준: 기준표 값 그대로, 조절 바 기준 하나만 바뀐다 (#ioff_na_hi=20 처럼 처음 값을 바꿔 열 수 있다)
const spec = {};
for (const r of CFG.rules) spec[r.col] = r.kind === 'flag' ? { on: true } : { lo: r.lo, hi: r.hi };
const m = decodeURIComponent(location.hash.slice(1)).match(new RegExp(`^${RULE.col}_${SIDE}=([\\d.]+)$`));
if (m) spec[RULE.col][SIDE] = Number(m[1]);

// ④ 판정: 기준표를 위에서부터 확인하고 처음 걸린 사유 하나를 돌려준다
function judge(r) {
  for (const rule of CFG.rules) {
    const s = spec[rule.col], v = r[rule.col];
    if (rule.kind === 'flag') { if (s.on && v > 0) return rule.reason; continue; }
    if ((s.lo != null && v < s.lo) || (s.hi != null && v > s.hi)) return rule.reason;
  }
  return 'none';
}

// ⑤ 지도: (x, y) 칸 하나에 한 줄. 한 칸에 여러 줄이면 칸을 작게 나눠 나란히 놓는다
let cells = [];
function buildMap() {
  const svg = $('map');
  const xs = rows.map(r => r[CFG.x]), ys = rows.map(r => r[CFG.y]);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (CFG.outline) { x0 = Math.min(x0, -CFG.outline); x1 = Math.max(x1, CFG.outline - 1); y0 = Math.min(y0, -CFG.outline); y1 = Math.max(y1, CFG.outline - 1); }
  const nx = x1 - x0 + 1, ny = y1 - y0 + 1, S = 100 / Math.max(nx, ny);
  const slot = {}, count = {};
  rows.forEach(r => { const k = r[CFG.x] + ',' + r[CFG.y]; count[k] = (count[k] || 0) + 1; });
  const sub = Math.ceil(Math.sqrt(Math.max(...Object.values(count))));
  svg.setAttribute('viewBox', `-1 -1 ${nx * S + 2} ${ny * S + 2}`);
  if (CFG.outline) {
    svg.appendChild(el('circle', { cx: (0 - x0) * S, cy: (y1 + 1) * S, r: CFG.outline * S, fill: 'none', stroke: '#C4C9CE', 'stroke-width': 0.35 }));
  } else {
    for (const k in count) {
      const [x, y] = k.split(',').map(Number);
      svg.appendChild(el('rect', { x: (x - x0) * S + 0.15, y: (y1 - y) * S + 0.15, width: S - 0.3, height: S - 0.3, fill: '#F1F2F4' }));
    }
  }
  const pad = sub > 1 ? 0.06 : 0.04;
  cells = rows.map((r, i) => {
    const k = r[CFG.x] + ',' + r[CFG.y], j = (slot[k] = (slot[k] || 0) + 1) - 1, w = S / sub;
    const rect = el('rect', { x: (r[CFG.x] - x0) * S + (j % sub) * w + w * pad, y: (y1 - r[CFG.y]) * S + Math.floor(j / sub) * w + w * pad,
                              width: w * (1 - 2 * pad), height: w * (1 - 2 * pad), rx: w * 0.08 });
    rect.addEventListener('mousemove', e => showTip(e, i));
    rect.addEventListener('mouseleave', () => $('tip').style.display = 'none');
    svg.appendChild(rect);
    return rect;
  });
}

function showTip(e, i) {
  const r = rows[i], k = judge(r), tip = $('tip');
  tip.innerHTML = '<table>' + header.map((h, j) => `<tr><td>${h}</td><td>${r._raw[j]}</td></tr>`).join('') +
    `<tr><td>화면 판정</td><td><b>${k === 'none' ? CFG.labels.pass : reasonName[k]}</b></td></tr></table>`;
  tip.style.display = 'block';
  const x = e.clientX + 14, y = Math.min(e.clientY + 10, innerHeight - tip.offsetHeight - 6);
  tip.style.left = (x + tip.offsetWidth > innerWidth ? e.clientX - tip.offsetWidth - 14 : x) + 'px';
  tip.style.top = Math.max(6, y) + 'px';
}

// 가로 막대: 이름 · 막대 · 숫자
function hbars(svg, items, max, color, W, rowH) {
  svg.innerHTML = '';
  const L = 96, R = 56, bw = W - L - R;
  items.forEach((it, i) => {
    const y = i * rowH + 4, h = rowH - 10, w = Math.max(0, it.value / (max || 1) * bw);
    svg.appendChild(el('text', { x: L - 8, y: y + h / 2 + 4, 'text-anchor': 'end', 'font-size': 12, fill: COLOR.ink }, it.label));
    svg.appendChild(el('rect', { x: L, y, width: w, height: h, rx: 2, fill: color }));
    svg.appendChild(el('text', { x: L + w + 6, y: y + h / 2 + 4, 'font-size': 12, 'font-weight': 600, fill: COLOR.ink }, it.text));
  });
}

// ⑥ 분포: 측정값을 구간으로 나눠 센 막대 + 합격선
const vals = rows.map(r => r[RULE.col]);
const dec = decOf(RULE.step);
const G = { min: Math.floor(Math.min(...vals, RULE[SIDE])), max: Math.ceil(Math.max(...vals, RULE[SIDE])) };
function drawDist() {
  const svg = $('dist'), W = 680, H = 150, L = 30, R = 30, B = 20, N = 60, bw = (W - L - R) / N;
  const X = v => L + (v - G.min) / (G.max - G.min) * (W - L - R);
  const bins = new Array(N).fill(0);
  vals.forEach(v => bins[Math.min(N - 1, Math.floor((v - G.min) / (G.max - G.min) * N))]++);
  const top = Math.sqrt(Math.max(...bins)), cut = spec[RULE.col][SIDE];
  svg.innerHTML = '';
  svg.appendChild(SIDE === 'hi' ? el('rect', { x: X(cut), y: 0, width: Math.max(0, W - R - X(cut)), height: H - B, fill: COLOR.band })
                                 : el('rect', { x: L, y: 0, width: Math.max(0, X(cut) - L), height: H - B, fill: COLOR.band }));
  bins.forEach((n, i) => {
    if (!n) return;
    const h = Math.max(2, Math.sqrt(n) / top * (H - B - 8));
    svg.appendChild(el('rect', { x: L + i * bw + 0.8, y: H - B - h, width: bw - 1.6, height: h, fill: over(G.min + (i + 0.5) / N * (G.max - G.min)) ? COLOR.fail : COLOR.bar }));
  });
  svg.appendChild(el('line', { x1: L, x2: W - R, y1: H - B, y2: H - B, stroke: '#C4C9CE' }));
  const raw = (G.max - G.min) / 5, p10 = Math.pow(10, Math.floor(Math.log10(raw)));
  const tick = [1, 2, 5, 10].map(k => k * p10).find(k => k >= raw);       // 눈금 간격: 1 · 2 · 5 단위
  for (let v = Math.ceil(G.min / tick) * tick; v <= G.max + 1e-9; v += tick) {
    svg.appendChild(el('text', { x: X(v), y: H - 5, 'text-anchor': 'middle', 'font-size': 11, fill: COLOR.muted }, +v.toFixed(2)));
  }
  svg.appendChild(el('line', { x1: X(cut), x2: X(cut), y1: 0, y2: H - B, stroke: COLOR.fail, 'stroke-width': 2.5 }));
}

// ⑦ 다시 그리기: 조절 바를 움직이면 카드 · 지도 · 차트 · 분포가 함께 바뀐다
function update() {
  const L = CFG.labels;
  const res = rows.map(judge);
  const total = rows.length, pass = res.filter(k => k === 'none').length, fail = total - pass;
  $('kTotal').textContent = total;
  $('kPass').textContent = pass;
  $('kFail').textContent = fail;
  $('kRate').textContent = (pass / total * 100).toFixed(2);

  res.forEach((k, i) => cells[i].setAttribute('fill', k === 'none' ? COLOR.pass : COLOR.fail));
  $('legend').innerHTML = `<span><i style="background:${COLOR.pass}"></i>${L.pass} ${pass}</span>` +
    `<span><i style="background:${COLOR.fail}"></i>${L.fail} ${fail}</span>`;

  const byReason = CFG.reasons.map(([key, name]) => ({ label: name, value: res.filter(k => k === key).length }))
    .sort((a, b) => b.value - a.value).map(it => ({ ...it, text: String(it.value) }));
  hbars($('reasons'), byReason, Math.max(1, ...byReason.map(b => b.value)), COLOR.fail, 330, 170 / CFG.reasons.length);
  const byZone = CFG.zones.map(([key, name]) => {
    const idx = rows.map((r, i) => i).filter(i => rows[i][CFG.zoneCol] === key), p = idx.filter(i => res[i] === 'none').length;
    const v = idx.length ? p / idx.length * 100 : 0;
    return { label: name, value: v, text: v.toFixed(1) + '%' };
  });
  hbars($('zones'), byZone, 100, COLOR.pass, 330, 120 / CFG.zones.length);

  const cut = spec[RULE.col][SIDE];
  $('val').textContent = `${L.pass}선 ${cut.toFixed(dec)} ${RULE.unit} ${SIDE === 'hi' ? '이하' : '이상'}`;
  $('hit').textContent = `${RULE.name} 기준에 걸림 ${vals.filter(over).length}${CFG.count}`;
  drawDist();
}

// 처음 화면
document.title = CFG.title;
$('title').textContent = CFG.title;
$('meta').textContent = `${CFG.dataName} · ${rows.length}줄`;
['total', 'pass', 'fail', 'rate'].forEach(k => $('l' + k[0].toUpperCase() + k.slice(1)).textContent = CFG.labels[k]);
document.querySelectorAll('.cu').forEach(e => e.textContent = CFG.count);
$('mapTitle').textContent = CFG.mapTitle;
$('reasonTitle').textContent = CFG.reasonTitle;
$('zoneTitle').textContent = CFG.zoneTitle;
$('distTitle').textContent = `${RULE.name} 분포 (${RULE.unit})`;
const slider = $('slider');
Object.assign(slider, { min: G.min, max: G.max, step: RULE.step, value: spec[RULE.col][SIDE] });
slider.addEventListener('input', () => { spec[RULE.col][SIDE] = Number(slider.value); update(); });
buildMap();
update();
</script>
</body>
</html>
