<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --ink:#17181A; --muted:#6B7075; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink);
         font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  .app { width: 1280px; height: 720px; padding: 18px 28px 10px; display: flex; flex-direction: column; gap: 8px; }
  header { display: flex; align-items: baseline; gap: 16px; }
  h1 { font-size: 26px; margin: 0; }
  .meta { color: var(--muted); font-size: 15px; }
  #chart { flex: 1; width: 100%; min-height: 0; display: block; }
</style>
</head>
<body>
<div class="app">
  <header><h1 id="title"></h1><span class="meta" id="meta"></span></header>
  <svg id="chart" role="img"></svg>
</div>

<script>
// ① 데이터: 엑셀을 CSV 글자로 저장해 그대로 붙여 넣었다 (한 줄 = 하나)
const CSV_TEXT = `__CSV__`;

// ② 설정: 칸 번호 열 · 판정 열 · 화면 이름
const CFG = /*__CFG__*/{};

const $ = id => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';
const COLOR = { pass: '#2BA84A', fail: '#E8344E', ring: '#C4C9CE', ink: '#17181A', muted: '#6B7075' };

function el(tag, attrs = {}, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}

function parseCSV(text) {
  const lines = text.replace(/^﻿/, '').trim().split(/\r?\n/);
  const head = lines[0].split(',').map(s => s.trim());
  return lines.slice(1).filter(l => l.trim()).map(l => {
    const c = l.split(','), o = {};
    head.forEach((h, i) => o[h] = (c[i] ?? '').trim());
    return o;
  });
}
const rows = parseCSV(CSV_TEXT);
rows.forEach(r => { r[CFG.x] = Number(r[CFG.x]); r[CFG.y] = Number(r[CFG.y]); });
const isPass = r => r[CFG.judgeCol] === CFG.passValue;
const pass = rows.filter(isPass).length, fail = rows.length - pass;

// ③ 칸 범위: 칸 번호의 최소 ~ 최대. 원 테두리는 칸 묶음 가운데에서 가장 먼 칸 모서리까지
const xs = rows.map(r => r[CFG.x]), ys = rows.map(r => r[CFG.y]);
const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
const cx = (x0 + x1 + 1) / 2, cy = (y0 + y1 + 1) / 2;
const far = (v, c) => Math.max(Math.abs(v - c), Math.abs(v + 1 - c));
const rad = CFG.outline ? Math.ceil(Math.max(...rows.map(r => Math.hypot(far(r[CFG.x], cx), far(r[CFG.y], cy))))) : 0;
const gx0 = CFG.outline ? Math.min(x0, cx - rad) : x0, gx1 = CFG.outline ? Math.max(x1 + 1, cx + rad) : x1 + 1;
const gy0 = CFG.outline ? Math.min(y0, cy - rad) : y0, gy1 = CFG.outline ? Math.max(y1 + 1, cy + rad) : y1 + 1;

// 축 숫자: 양 끝 + 5 의 배수
function ticks(a, b) {
  const t = [a];
  for (let v = Math.ceil((a + 1) / 5) * 5; v < b; v += 5) if (v - a >= 2 && b - v >= 2) t.push(v);
  return [...t, b];
}

// ④ 그리기: 한 줄 = 한 칸. 합격 초록 · 불합격 빨강
function draw() {
  const svg = $('chart'), box = svg.getBoundingClientRect(), W = box.width, H = box.height;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const L = 70, T = 34, B = 62, LEG = 180, GAP = 36;
  const S = Math.min((W - L - GAP - LEG) / (gx1 - gx0), (H - T - B) / (gy1 - gy0));
  const mapW = (gx1 - gx0) * S, mapH = (gy1 - gy0) * S;
  const ox = (W - (L + mapW + GAP + LEG)) / 2 + L;   // 지도 + 범례 묶음을 가운데로
  const X = v => ox + (v - gx0) * S, Y = v => T + (gy1 - v) * S;   // 세로칸은 아래가 작은 번호

  if (CFG.outline) svg.appendChild(el('circle', { cx: X(cx), cy: Y(cy), r: rad * S, fill: 'none', stroke: COLOR.ring, 'stroke-width': 2 }));
  const pad = S * 0.06;
  rows.forEach(r => {
    const cell = el('rect', { x: X(r[CFG.x]) + pad, y: Y(r[CFG.y] + 1) + pad, width: S - 2 * pad, height: S - 2 * pad, rx: S * 0.1,
                              fill: isPass(r) ? COLOR.pass : COLOR.fail });
    cell.appendChild(el('title', {}, `${CFG.x} ${r[CFG.x]} · ${CFG.y} ${r[CFG.y]} · ${r[CFG.judgeCol]}`));
    svg.appendChild(cell);
  });

  ticks(x0, x1).forEach(v => svg.appendChild(el('text', { x: X(v + 0.5), y: Y(gy0) + 24, 'text-anchor': 'middle', 'font-size': 14, fill: COLOR.muted }, v)));
  ticks(y0, y1).forEach(v => svg.appendChild(el('text', { x: X(gx0) - 10, y: Y(v + 0.5) + 5, 'text-anchor': 'end', 'font-size': 14, fill: COLOR.muted }, v)));
  svg.appendChild(el('text', { x: X((gx0 + gx1) / 2), y: H - 10, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 600, fill: COLOR.ink }, `${CFG.x} →`));
  svg.appendChild(el('text', { x: X(gx0) - 10, y: T - 14, 'text-anchor': 'end', 'font-size': 16, 'font-weight': 600, fill: COLOR.ink }, `${CFG.y} ↑`));

  const lx = ox + mapW + GAP;                       // 범례: 색 · 이름 · 칸 수
  [[COLOR.pass, CFG.labels.pass, pass], [COLOR.fail, CFG.labels.fail, fail]].forEach(([c, name, k], i) => {
    const y = T + 20 + i * 40;
    svg.appendChild(el('rect', { x: lx, y: y - 16, width: 20, height: 20, rx: 3, fill: c }));
    svg.appendChild(el('text', { x: lx + 30, y: y, 'font-size': 19, fill: COLOR.ink }, name));
    svg.appendChild(el('text', { x: lx + LEG - 10, y: y, 'text-anchor': 'end', 'font-size': 19, 'font-weight': 700, fill: COLOR.ink }, k));
  });
}

// 화면 글자
document.title = CFG.title;
$('title').textContent = CFG.title;
$('meta').textContent = `${CFG.dataName} · 가로 ${x1 - x0 + 1}칸 × 세로 ${y1 - y0 + 1}칸 · ${CFG.item} ${rows.length}${CFG.count}`;
draw();
</script>
</body>
</html>
