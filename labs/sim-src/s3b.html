<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --pass:#2BA84A; --fail:#E8344E; --ink:#17181A; --muted:#6B7075; --line:#E4E6E8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink);
         font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  .app { width: 1280px; height: 720px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  header { display: flex; align-items: baseline; gap: 14px; height: 30px; }
  h1 { font-size: 20px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
  .kpi .lb { font-size: 12px; color: var(--muted); }
  .kpi .v { font-size: 28px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .kpi .v small { font-size: 13px; font-weight: 500; margin-left: 2px; color: var(--muted); }
  .kpi.main { border-color: var(--ink); }
  .up { color: var(--pass); } .dn { color: var(--fail); }
</style>
</head>
<body>
<div class="app">
  <header><h1 id="title"></h1><span class="meta" id="meta"></span></header>
  <div class="kpis">
    <div class="kpi"><div class="lb" id="lTotal"></div><div class="v"><span id="kTotal"></span><small class="cu"></small></div></div>
    <div class="kpi"><div class="lb" id="lPass"></div><div class="v up"><span id="kPass"></span><small class="cu"></small></div></div>
    <div class="kpi"><div class="lb" id="lFail"></div><div class="v dn"><span id="kFail"></span><small class="cu"></small></div></div>
    <div class="kpi main"><div class="lb" id="lRate"></div><div class="v"><span id="kRate"></span><small>%</small></div></div>
  </div>
</div>

<script>
// ① 데이터: 엑셀을 CSV 글자로 저장해 그대로 붙여 넣었다 (한 줄 = 하나)
const CSV_TEXT = `__CSV__`;

// ② 설정: 열 이름 · 화면 이름
const CFG = /*__CFG__*/{};

const $ = id => document.getElementById(id);

function parseCSV(text) {
  const lines = text.replace(/^﻿/, '').trim().split(/\r?\n/);
  const head = lines[0].split(',').map(s => s.trim());
  return lines.slice(1).filter(l => l.trim()).map(l => {
    const c = l.split(','), o = {};
    head.forEach((h, i) => o[h] = (c[i] ?? '').trim());
    return o;
  });
}
const rows = parseCSV(CSV_TEXT);

// ③ 숫자 카드: 전체 · 합격 · 불합격 · 수율
const total = rows.length;
const pass = rows.filter(r => r[CFG.judgeCol] === CFG.passValue).length;
const fail = total - pass;
$('kTotal').textContent = total;
$('kPass').textContent = pass;
$('kFail').textContent = fail;
$('kRate').textContent = (pass / total * 100).toFixed(2);

// 화면 글자
document.title = CFG.title;
$('title').textContent = CFG.title;
$('meta').textContent = `${CFG.dataName} · ${rows.length}줄`;
['total', 'pass', 'fail', 'rate'].forEach(k => $('l' + k[0].toUpperCase() + k.slice(1)).textContent = CFG.labels[k]);
document.querySelectorAll('.cu').forEach(e => e.textContent = CFG.count);
</script>
</body>
</html>
