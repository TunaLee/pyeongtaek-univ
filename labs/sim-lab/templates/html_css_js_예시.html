<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>HTML · CSS · JS 예시</title>

<!-- ② CSS: 꾸밈 (색 · 크기 · 배치) -->
<style>
  body  { font-family: sans-serif; color: #17181A; padding: 40px; }
  .card { display: inline-block; border: 1px solid #E4E6E8; border-radius: 10px; padding: 16px 24px; }
  .num  { font-size: 40px; font-weight: 700; color: #2BA84A; }
</style>
</head>
<body>

<!-- ① HTML: 뼈대 (무엇이 어디에 있나) -->
<h1>과일 가게</h1>
<div class="card">
  <div>사과 개수</div>
  <div class="num" id="count">0</div>
</div>
<button id="add">사과 하나 더</button>

<!-- ③ JS: 동작 (누르면 숫자가 바뀐다) -->
<script>
  let apples = 3;
  document.getElementById('count').textContent = apples;
  document.getElementById('add').addEventListener('click', () => {
    apples = apples + 1;
    document.getElementById('count').textContent = apples;
  });
</script>
</body>
</html>
